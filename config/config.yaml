# =============================================================================
# ATM Area Surveillance Edge AI — Main Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Camera settings
# -----------------------------------------------------------------------------
camera:
  rtsp_url: "rtsp://admin:password@192.168.1.100:554/stream"
  width: 1280
  height: 720
  fps: 15
  camera_id: "cam_01"
  location: "ATM Entrance"
  reconnect_delay: 5.0
  max_reconnect_attempts: 10

# -----------------------------------------------------------------------------
# YOLOv8 model settings
# -----------------------------------------------------------------------------
model:
  path: "models/atm_surveillance.pt"
  confidence_threshold: 0.50
  iou_threshold: 0.45
  # Optional separate COCO model for person detection
  person_model_path: "models/yolov8n.pt"
  person_confidence_threshold: 0.50
  device: "cpu"  # "cpu" or "0" for GPU

# -----------------------------------------------------------------------------
# Detection & alert parameters
# -----------------------------------------------------------------------------
detection:
  loitering_threshold_seconds: 120     # flag loitering after 2 minutes
  loitering_cooldown_seconds: 60       # re-alert cooldown for same person/zone
  alert_cooldown_seconds: 30           # cooldown for weapon/concealment alerts
  weapon_confidence_threshold: 0.60
  concealment_confidence_threshold: 0.65
  tracker_iou_threshold: 0.30
  tracker_max_age: 30                  # frames before inactive track is removed

# -----------------------------------------------------------------------------
# Zone definitions
# -----------------------------------------------------------------------------
zones:
  json_path: "config/zones.json"

# -----------------------------------------------------------------------------
# Database
# -----------------------------------------------------------------------------
database:
  path: "database/alerts.db"

# -----------------------------------------------------------------------------
# Snapshot images
# -----------------------------------------------------------------------------
snapshots:
  dir: "snapshots"
  jpeg_quality: 85

# -----------------------------------------------------------------------------
# REST API
# -----------------------------------------------------------------------------
api:
  host: "0.0.0.0"
  port: 5000
  auth_token: "change-me-in-production"
  cors_origins: "*"
  debug: false

# -----------------------------------------------------------------------------
# Performance
# -----------------------------------------------------------------------------
performance:
  target_fps: 8        # processing FPS (frames skipped beyond this)
  frame_queue_size: 2

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: "INFO"        # DEBUG | INFO | WARNING | ERROR | CRITICAL
  log_dir: "logs"
  max_file_bytes: 5242880   # 5 MB
  backup_count: 5
