# =============================================================================
# Nginx reverse proxy configuration for ATM Surveillance API
# =============================================================================
# Place at /etc/nginx/sites-available/atm-surveillance
# Enable: sudo ln -s /etc/nginx/sites-available/atm-surveillance \
#                     /etc/nginx/sites-enabled/
# =============================================================================

server {
    listen 80;
    server_name _;  # replace with your Pi's hostname or IP

    # Enforce reasonable request sizes
    client_max_body_size 1M;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Serve snapshot images directly for better performance
    location /snapshots/ {
        alias /opt/atm-surveillance/snapshots/;
        add_header Cache-Control "public, max-age=86400";
    }
}
