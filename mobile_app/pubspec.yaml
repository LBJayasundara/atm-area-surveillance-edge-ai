name: atm_surveillance_app
description: ATM Area Surveillance mobile application for security personnel.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase packages
  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.9
  firebase_auth: ^4.15.3

  # Other packages
  provider: ^6.1.1
  http: ^1.1.0
  flutter_local_notifications: ^16.1.0
  cached_network_image: ^3.3.0
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  photo_view: ^0.14.0
  timeago: ^3.5.0
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
